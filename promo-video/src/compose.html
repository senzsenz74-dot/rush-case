<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RUSH CASE — промо 16:9</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;800;900&display=block" rel="stylesheet">
<style>
  /* композиция 16:9: сайт целиком, «камера» наезжает на механики; хук и финал — в фирменном стиле */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#060607}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Manrope,sans-serif;color:#fff}
  #bg{position:absolute;inset:-60px;background:url("/site/assets/bg-obsidian.svg") center/cover no-repeat}
  #view{position:absolute;inset:0;overflow:hidden;will-change:filter,opacity}
  #shot{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #dust{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
  #vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
  /* подпись — нижняя треть */
  #capBand{position:absolute;left:0;right:0;bottom:0;height:300px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(5,4,3,.82) 70%)}
  #cap{position:absolute;left:96px;bottom:84px;pointer-events:none;display:flex;align-items:center;gap:22px}
  #cap i{width:8px;height:64px;border-radius:4px;background:linear-gradient(180deg,#ffe9a8,#f6c650 50%,#c98a1f);box-shadow:0 0 24px rgba(245,190,90,.7)}
  #cap .t{font:900 56px/1.05 Unbounded,sans-serif;text-transform:uppercase;letter-spacing:.01em;
    background:linear-gradient(180deg,#fff7dc 0%,#ffe08a 38%,#f2b23c 70%,#c98a1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.6))}
  /* хук */
  #hook,#cta{position:absolute;inset:0;pointer-events:none}
  #hookCase{position:absolute;left:50%;top:50%;width:900px;transform-origin:50% 50%}
  #hookCase img{width:100%;display:block;filter:drop-shadow(0 50px 70px rgba(0,0,0,.85))}
  #hookCase .sh{position:absolute;inset:0;-webkit-mask-image:url("/site/assets/case-orange.webp");mask-image:url("/site/assets/case-orange.webp");-webkit-mask-size:100% 100%;mask-size:100% 100%;
    background:linear-gradient(105deg,transparent 40%,rgba(255,246,214,.9) 50%,transparent 60%) no-repeat;background-size:300% 100%;mix-blend-mode:screen}
  .logo{position:absolute;left:50%;transform-origin:50% 50%;filter:drop-shadow(0 10px 30px rgba(0,0,0,.8)) drop-shadow(0 0 40px rgba(245,170,60,.45))}
  .logo img{width:100%;display:block}
  .ring{position:absolute;left:50%;border-radius:50%;border:4px solid rgba(255,214,120,.85);box-shadow:0 0 40px rgba(255,190,80,.7),inset 0 0 40px rgba(255,190,80,.5);transform:translate(-50%,-50%)}
  #hookTxt{position:absolute;left:0;right:0;top:820px;text-align:center;font:900 60px Unbounded,sans-serif;text-transform:uppercase;
    background:linear-gradient(180deg,#fff7dc,#ffe08a 40%,#f2b23c 75%,#c98a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.6))}
  #flash{position:absolute;inset:0;background:radial-gradient(55% 55% at 50% 48%,rgba(255,226,160,.85),rgba(255,190,90,.3) 45%,transparent 75%);mix-blend-mode:screen;pointer-events:none;opacity:0}
  #streak{position:absolute;top:-200px;bottom:-200px;width:420px;left:50%;margin-left:-210px;pointer-events:none;opacity:0;mix-blend-mode:screen;
    background:linear-gradient(90deg,transparent,rgba(255,236,190,.8) 50%,transparent);filter:blur(24px)}
  /* финал */
  #ctaHalo{position:absolute;left:50%;top:330px;width:1400px;height:1400px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(245,180,70,.33),rgba(245,170,60,.1) 50%,transparent 75%)}
  #ctaTitle{position:absolute;left:120px;right:120px;top:600px;text-align:center;font:900 62px/1.12 Unbounded,sans-serif;text-transform:uppercase;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.6)}
  #ctaTitle b{background:linear-gradient(180deg,#fff7dc,#ffe08a 40%,#f2b23c 75%,#c98a1f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.6))}
  #ctaUrl{position:absolute;left:50%;top:820px;transform:translateX(-50%);white-space:nowrap;padding:24px 48px;border-radius:24px;
    font:800 46px Manrope,sans-serif;color:#ffe6a6;background:linear-gradient(180deg,rgba(28,24,17,.96),rgba(12,11,9,.96)) padding-box,linear-gradient(135deg,#8a6a2c,#f7dc8f 30%,#a77a2a 55%,#ffe9a8 75%,#8d6726) border-box;border:3px solid transparent;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.9),0 0 50px -10px rgba(245,190,90,.55)}
</style>
</head>
<body>
<div id="root">
  <div id="bg"></div>
  <div id="view"><img id="shot" alt=""></div>
  <div id="vign"></div>
  <canvas id="dust" width="1920" height="1080"></canvas>
  <div id="capBand"></div>
  <div id="cap"><i></i><span class="t" id="capT"></span></div>
  <div id="hook">
    <div id="hookCase"><img src="/site/assets/case-orange.webp" alt=""><i class="sh"></i></div>
    <div class="ring" id="ring1"></div>
    <div class="logo" id="hookLogo"><img src="/site/assets/logo.png" alt=""></div>
    <div id="hookTxt">Готов к открытию?</div>
  </div>
  <div id="cta">
    <div id="ctaHalo"></div>
    <div class="ring" id="ring2"></div>
    <div class="logo" id="ctaLogo"><img src="/site/assets/logo.png" alt=""></div>
    <div id="ctaTitle"></div>
    <div id="ctaUrl"></div>
  </div>
  <div id="streak"></div>
  <div id="flash"></div>
</div>
<script src="/src/compose-scene.js"></script>
</body>
</html>
