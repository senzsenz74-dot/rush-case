<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RUSH CASE — промо 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;800;900&display=block" rel="stylesheet">
<style>
  /* композиция ролика: фирменный фон сайта, «парящие» панели реального интерфейса, подписи, хук и финал */
  :root{--gold:#f5c76b;--g-gold:linear-gradient(180deg,#ffe9a8 0%,#f6c650 45%,#c98a1f 100%)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#060607}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Manrope,sans-serif;color:#fff}
  #bg{position:absolute;inset:-60px;background:url("/site/assets/bg-obsidian.svg") center/cover no-repeat;will-change:transform}
  #vign{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 45%,transparent 40%,rgba(0,0,0,.72) 100%);pointer-events:none}
  #dust{position:absolute;inset:0;width:1080px;height:1920px}
  /* сцена с панелями */
  #stage{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 48%}
  .pn{position:absolute;left:0;top:0;transform-origin:50% 50%;transform-style:preserve-3d;will-change:transform,filter,opacity}
  .pn img.main{display:block;width:100%;height:100%;border-radius:22px;
    box-shadow:0 0 0 2px rgba(245,199,107,.55),0 0 0 3px rgba(0,0,0,.7),0 60px 120px -30px rgba(0,0,0,.95),0 0 90px -20px rgba(245,199,107,.35)}
  .pn .gl{position:absolute;inset:0;border-radius:22px;pointer-events:none;mix-blend-mode:screen;
    background:linear-gradient(105deg,transparent 35%,rgba(255,232,170,.0) 42%,rgba(255,240,200,.32) 50%,rgba(255,232,170,0) 58%,transparent 65%) no-repeat;background-size:260% 100%}
  .pn .rf{position:absolute;left:0;right:0;top:100%;height:42%;margin-top:14px;border-radius:22px;overflow:hidden;opacity:.22;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 75%);mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 75%)}
  .pn .rf img{width:100%;transform:scaleY(-1);transform-origin:50% 50%;display:block;filter:blur(2px)}
  #amb{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%);filter:blur(90px) saturate(1.3);opacity:.35;pointer-events:none}
  #amb img{width:100%;height:100%;object-fit:cover}
  /* подписи */
  #cap{position:absolute;left:80px;right:80px;top:280px;text-align:center;pointer-events:none}
  #cap .t{display:inline-block;font:900 78px/1.04 Unbounded,sans-serif;text-transform:uppercase;letter-spacing:.01em;
    background:linear-gradient(180deg,#fff7dc 0%,#ffe08a 38%,#f2b23c 70%,#c98a1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.55)) drop-shadow(0 0 28px rgba(245,170,60,.35))}
  #cap .t small{display:block;font-size:.62em;margin-top:.18em;letter-spacing:.02em}
  #cap .ln{display:block;width:200px;height:3px;margin:26px auto 0;background:linear-gradient(90deg,transparent,#f5c76b,transparent)}
  #cap .sub{display:block;margin-top:18px;font:700 34px Manrope,sans-serif;color:#d9cfb9;letter-spacing:.02em}
  /* хук */
  #hook{position:absolute;inset:0;pointer-events:none}
  #hookCase{position:absolute;left:50%;top:50%;width:1000px;transform-origin:50% 50%}
  #hookCase img{width:100%;display:block;filter:drop-shadow(0 50px 70px rgba(0,0,0,.85))}
  #hookCase .sh{position:absolute;inset:0;-webkit-mask-image:url("/site/assets/case-orange.webp");mask-image:url("/site/assets/case-orange.webp");-webkit-mask-size:100% 100%;mask-size:100% 100%;
    background:linear-gradient(105deg,transparent 40%,rgba(255,246,214,.9) 50%,transparent 60%) no-repeat;background-size:300% 100%;mix-blend-mode:screen}
  .logo{position:absolute;left:50%;transform-origin:50% 50%;filter:drop-shadow(0 10px 30px rgba(0,0,0,.8)) drop-shadow(0 0 40px rgba(245,170,60,.45))}
  .logo img{width:100%;display:block}
  .ring{position:absolute;left:50%;border-radius:50%;border:4px solid rgba(255,214,120,.85);box-shadow:0 0 40px rgba(255,190,80,.7),inset 0 0 40px rgba(255,190,80,.5);transform:translate(-50%,-50%)}
  #flash{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 48%,rgba(255,226,160,.9),rgba(255,190,90,.35) 45%,transparent 75%);mix-blend-mode:screen;pointer-events:none;opacity:0}
  #streak{position:absolute;left:-200px;right:-200px;height:260px;top:50%;margin-top:-130px;pointer-events:none;opacity:0;mix-blend-mode:screen;
    background:linear-gradient(90deg,transparent,rgba(255,220,140,.0) 20%,rgba(255,236,190,.75) 50%,rgba(255,220,140,0) 80%,transparent);filter:blur(18px)}
  /* финал */
  #cta{position:absolute;inset:0;pointer-events:none}
  #ctaHalo{position:absolute;left:50%;top:640px;width:1200px;height:1200px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(245,180,70,.33),rgba(245,170,60,.1) 50%,transparent 75%)}
  #ctaTitle{position:absolute;left:90px;right:90px;top:980px;text-align:center;font:900 66px/1.14 Unbounded,sans-serif;text-transform:uppercase;color:#fff;letter-spacing:.005em;text-shadow:0 6px 0 rgba(0,0,0,.6)}
  #ctaTitle b{background:linear-gradient(180deg,#fff7dc,#ffe08a 40%,#f2b23c 75%,#c98a1f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.6))}
  #ctaUrl{position:absolute;left:50%;top:1300px;transform:translateX(-50%);white-space:nowrap;padding:26px 44px;border-radius:26px;
    font:800 44px Manrope,sans-serif;letter-spacing:.01em;color:#ffe6a6;background:linear-gradient(180deg,rgba(28,24,17,.96),rgba(12,11,9,.96)) padding-box,linear-gradient(135deg,#8a6a2c,#f7dc8f 30%,#a77a2a 55%,#ffe9a8 75%,#8d6726) border-box;border:3px solid transparent;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.9),0 0 50px -10px rgba(245,190,90,.55)}
  #ctaBtn{position:absolute;left:50%;top:1250px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;height:98px;padding:0 56px;border-radius:22px;white-space:nowrap;
    font:900 36px Unbounded,sans-serif;text-transform:uppercase;color:#2a1a02;background:linear-gradient(180deg,#ffeaa6,#f6c650 50%,#d6941f);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 20px 50px -14px rgba(245,190,80,.9)}
</style>
</head>
<body>
<div id="root">
  <div id="bg"></div>
  <div id="amb"><img alt=""></div>
  <canvas id="dust" width="1080" height="1920"></canvas>
  <div id="stage">
    <div class="pn" id="pA"><img class="main" alt=""><div class="rf"><img alt=""></div><i class="gl"></i></div>
    <div class="pn" id="pB"><img class="main" alt=""><div class="rf"><img alt=""></div><i class="gl"></i></div>
  </div>
  <div id="vign"></div>
  <div id="hook">
    <div id="hookCase"><img src="/site/assets/case-orange.webp" alt=""><i class="sh"></i></div>
    <div class="ring" id="ring1"></div>
    <div class="logo" id="hookLogo"><img src="/site/assets/logo.png" alt=""></div>
  </div>
  <div id="cta">
    <div id="ctaHalo"></div>
    <div class="ring" id="ring2"></div>
    <div class="logo" id="ctaLogo"><img src="/site/assets/logo.png" alt=""></div>
    <div id="ctaTitle"></div>
    <div id="ctaBtn">Открыть первый кейс</div>
    <div id="ctaUrl"></div>
  </div>
  <div id="cap"><span class="t" id="capT"></span><i class="ln"></i></div>
  <div id="streak"></div>
  <div id="flash"></div>
</div>
<script src="/src/compose-scene.js"></script>
</body>
</html>
